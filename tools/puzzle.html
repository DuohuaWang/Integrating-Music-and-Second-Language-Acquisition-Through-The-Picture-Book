<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>拼拼看！Syllable Puzzle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ color-scheme:light dark; --ink:#3b2a6b; --bg1:#fff4c2; --bg2:#d9f2ff; --panel:rgba(255,255,255,.78); --chip:#fff; --chip-ink:#5b21b6; box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --ink:#f3e8ff; --bg1:#2a1f55; --bg2:#10253f; --panel:rgba(40,34,90,.7); --chip:#3b3270; --chip-ink:#f3e8ff; } }
  :root[data-theme="dark"]{ --ink:#f3e8ff; --bg1:#2a1f55; --bg2:#10253f; --panel:rgba(40,34,90,.7); --chip:#3b3270; --chip-ink:#f3e8ff; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; }
  body{ min-height:100vh; background:linear-gradient(180deg,var(--bg1),var(--bg2)); color:var(--ink);
    font-family:"Poppins","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; line-height:1.65; }
  header{ text-align:center; padding:1.3rem 1rem .3rem; }
  h1{ margin:0; font-size:clamp(1.6rem,6.5vw,2.4rem); font-weight:700; letter-spacing:.03em; }
  h1 small{ display:block; font-size:.45em; font-weight:500; letter-spacing:.16em; opacity:.75; }
  header p{ margin:.35rem 0 0; font-size:1.02rem; }
  main{ max-width:34rem; margin:0 auto; padding:.5rem 1rem 3rem; }
  .picker{ display:flex; gap:.55rem; flex-wrap:wrap; justify-content:center; margin:.6rem 0 .8rem; }
  .chip{ font:inherit; font-size:1rem; font-weight:600; border:3px solid #fff; background:var(--chip); color:var(--chip-ink); border-radius:999px; padding:.45rem 1rem; min-height:46px; cursor:pointer;
    box-shadow:0 4px 0 rgba(91,33,182,.25); transition:transform .15s ease; }
  .chip:hover{ transform:translateY(-2px); }
  .chip[aria-pressed="true"]{ background:#7c3aed; color:#fff; border-color:#c4b5fd; }
  .tempo{ display:flex; align-items:center; gap:.5rem; flex-wrap:wrap; justify-content:center; margin:.2rem 0 .5rem; font-size:.9rem; }
  .tempo input[type=range]{ flex:1; min-width:7rem; max-width:13rem; accent-color:#7c3aed; height:2rem; }
  .tempo output{ font-weight:600; min-width:5rem; }
  .tempo label{ display:flex; align-items:center; gap:.35rem; }
  .tempo input[type=checkbox]{ width:1.1rem; height:1.1rem; accent-color:#7c3aed; }
  .prog{ display:flex; align-items:center; justify-content:center; gap:.4rem; margin:0 0 .5rem; font-weight:600; font-size:.95rem; }
  .dot{ width:1rem; height:1rem; border-radius:50%; background:rgba(0,0,0,.12); border:2px solid #fff; transition:background .2s, transform .2s; }
  .dot.on{ background:#22c55e; transform:scale(1.2); }
  .wrap{ position:relative; width:100%; max-width:520px; margin:0 auto; transition:height .45s ease; }
  .stage{ position:absolute; left:0; top:0; width:360px; transform-origin:0 0; touch-action:none; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; }
  .frame{ position:absolute; border:4px dashed #f59e0b; border-radius:18px; background:rgba(255,255,255,.7); }
  .frame-label{ position:absolute; left:0; right:0; top:-1.6rem; text-align:center; font-size:.88rem; font-weight:600; }
  .slot{ position:absolute; border-radius:10px; background:rgba(0,0,0,.055); border:2px dashed rgba(0,0,0,.18); }
  .slot.near{ background:rgba(250,204,21,.45); border-color:#f59e0b; }
  .tray{ position:absolute; border-radius:18px; background:var(--panel); border:3px solid rgba(255,255,255,.8); }
  .tray-label{ position:absolute; left:0; right:0; top:.3rem; text-align:center; font-size:.88rem; font-weight:600; opacity:.8; }
  /* 一塊「長方形碎片」＝一個音節：上面是圖片的直條，下面是那個音節的字 */
  .piece{ position:absolute; border-radius:10px; overflow:hidden; background-repeat:no-repeat; cursor:grab;
    box-shadow:0 3px 6px rgba(0,0,0,.35); display:flex; align-items:flex-end; justify-content:center; }
  .piece span{ display:flex; align-items:center; justify-content:center; width:100%; font-family:"Times New Roman",Times,serif; color:#000; line-height:1; white-space:nowrap; }
  .piece.drag{ cursor:grabbing; box-shadow:0 12px 16px rgba(0,0,0,.4); transform:scale(1.05) rotate(-1.5deg); z-index:400; }
  .piece.snap{ transition:left .12s ease, top .12s ease; }
  .piece.locked{ box-shadow:none; border-radius:0; cursor:default; }
  /* 單音節：整塊剪成水果外形。box-shadow 會被裁掉，所以改用 drop-shadow 跟著形狀走 */
  .piece.shaped{ border-radius:0; box-shadow:none; filter:drop-shadow(0 4px 5px rgba(0,0,0,.45)); }
  .piece.shaped.drag{ box-shadow:none; filter:drop-shadow(0 12px 14px rgba(0,0,0,.5)); }
  .piece.shaped.locked{ filter:drop-shadow(0 2px 3px rgba(0,0,0,.25)); }
  .piece.shaped .pill{ position:absolute; left:50%; bottom:15%; transform:translateX(-50%);
    width:auto; max-width:62%; background:rgba(255,255,255,.93); color:#000; border-radius:999px;
    padding:.08em .55em; line-height:1.2; font-size:.78em; box-shadow:0 1px 3px rgba(0,0,0,.2); }
  .slot.shaped{ border:0; border-radius:0; background:rgba(0,0,0,.1); }
  .slot.shaped.near{ background:rgba(250,204,21,.6); }
  /* 安靜方塊：休止符也要佔時間，所以它也是一塊要拖進去的 */
  .piece.rest{ background:#cbd5e1; border:3px dashed #94a3b8; border-radius:14px;
    flex-direction:column; align-items:center; justify-content:center; gap:.1em; color:#475569; }
  /* 八分休止符用 SVG 畫，因為多數裝置沒有這個音樂符號的字型 */
  .piece.rest .rs{ width:1.5em; height:2.2em; display:block; fill:#475569; }
  .piece.rest .rt{ font-size:.75em; width:auto; height:auto; opacity:.85; }
  .slot.rest-slot{ background:rgba(0,0,0,.04); border-style:dashed; }
  .piece.pop{ animation:pop .45s ease; }
  .piece.wiggle{ animation:wiggle .4s ease; }
  @keyframes pop{ 40%{ transform:scale(1.06); } }
  @keyframes wiggle{ 25%{ transform:translateX(-6px) rotate(-2deg); } 75%{ transform:translateX(6px) rotate(2deg); } }
  .stage.done .frame{ border-color:#22c55e; border-style:solid; }
  .stage.done .slot{ opacity:0; }
  .tray{ transition:opacity .5s ease; }
  .stage.done .tray{ opacity:0; }
  .board{ position:absolute; border-radius:14px; pointer-events:none; }
  .board.cheer{ animation:cheer .7s cubic-bezier(.2,1.5,.4,1); }
  @keyframes cheer{ 35%{ transform:scale(1.12) rotate(-2deg); } 70%{ transform:scale(1.04) rotate(1deg); } }
  .win{ position:absolute; inset:0; z-index:500; display:flex; align-items:center; justify-content:center; pointer-events:none; overflow:hidden; }
  .banner{ background:#fff; color:#5b21b6; border-radius:26px; padding:1rem 1.5rem; text-align:center; box-shadow:0 12px 30px rgba(0,0,0,.3); border:5px solid #facc15; animation:banner .6s cubic-bezier(.2,1.4,.4,1) both; }
  .banner b{ display:block; font-size:1.5rem; }
  .banner span{ font-size:.95rem; color:#7c3aed; }
  @keyframes banner{ from{ transform:scale(.2) rotate(-8deg); opacity:0; } to{ transform:scale(1); opacity:1; } }
  .confetti i{ position:absolute; top:-30px; font-style:normal; font-size:1.5rem; animation:fall var(--d) linear var(--dl) forwards; }
  @keyframes fall{ to{ transform:translateY(680px) rotate(360deg); opacity:.9; } }
  .bar{ display:flex; gap:.6rem; justify-content:center; flex-wrap:wrap; margin:1rem 0; }
  .btn{ font:inherit; font-size:1rem; font-weight:600; border:0; border-radius:999px; padding:.6rem 1.25rem; min-height:48px; cursor:pointer; background:#fde68a; color:#78350f; box-shadow:0 4px 0 #d97706; }
  .btn:active{ transform:translateY(3px); box-shadow:0 1px 0 #d97706; }
  .btn.green{ background:#86efac; color:#14532d; box-shadow:0 4px 0 #16a34a; }
  .btn.green:active{ box-shadow:0 1px 0 #16a34a; }
  .chip:focus-visible,.btn:focus-visible{ outline:4px solid #6aa84f; outline-offset:2px; }
  .wordcard{ margin:1rem auto 0; max-width:22rem; border-radius:22px; padding:1rem 1rem 1.2rem; text-align:center; color:#000; box-shadow:0 8px 20px rgba(0,0,0,.2); animation:banner .6s ease both; }
  .wordcard[hidden]{ display:none; }
  .wordcard svg{ height:84px; width:auto; max-width:90%; display:inline-block; }
  .syl{ font-family:"Times New Roman",Times,serif; font-size:clamp(2rem,9vw,3.1rem); line-height:1.15; }
  .syl b{ font-weight:700; }
  .wordcard .bar{ margin:.7rem 0 0; }
  .note{ text-align:center; font-size:.85rem; opacity:.75; margin-top:1.1rem; }
  @media (prefers-reduced-motion:reduce){ .banner,.wordcard,.piece.pop,.piece.wiggle,.board.cheer{ animation:none; } .confetti{ display:none; } .piece.snap,.chip,.dot{ transition:none; } }
</style>
</head>
<body>
<header>
  <h1>🧩 拼拼看！<small>SYLLABLE PUZZLE</small></h1>
  <p>把音節方塊拖到框框裡，拼出完整的單字！</p>
</header>
<main>
  <nav class="picker" id="picker" aria-label="選擇題目"></nav>
  <div class="tempo">
    <span aria-hidden="true">🐢</span>
    <input id="bpm" type="range" min="40" max="160" step="2" aria-label="速度 Tempo (BPM)">
    <span aria-hidden="true">🐇</span>
    <output id="bpmv" for="bpm"></output>
    <label><input id="onebeat" type="checkbox"> 一個單字一拍</label>
  </div>
  <div class="prog" id="prog" aria-live="polite"></div>
  <div class="wrap" id="wrap"><div class="stage" id="stage" role="application" aria-label="拼圖區：用手指或滑鼠拖曳音節方塊"></div></div>
  <div class="bar">
    <button class="btn" id="hint">💡 提示</button>
    <button class="btn" id="reset">🔄 重來</button>
    <button class="btn green" id="next">➡ 下一題</button>
  </div>
  <section class="wordcard" id="card" hidden></section>
  <p class="note">放對位置會「啪」地吸進去，全部拼好就會念出整個單字喔！</p>
</main>

<script>
/* ======================================================================
   🧒 【教學】怎麼換成「你自己的」圖片、單字和音效檔？
   ======================================================================

   這個拼圖會自動把一張完整圖片「直向切成長方形」，一個音節一塊，
   每一塊下面印著那個音節的字（例如 A ／ pple）。
   所以你不用自己切圖！只要給一張完整的圖片 + 音節，程式會自己切。

   ────────────────────────────────────────────────────────────────────
   步驟 A：換成你自己的圖片
   ────────────────────────────────────────────────────────────────────
   1. 準備一張「完整的」橫式圖片（建議寬高比大約 4:3，例如 420×300 像素）。
   2. 把圖片轉成 base64 文字（網頁不能連外抓圖，所以圖片必須嵌在裡面）：
        • Mac 終端機： base64 -i apple.jpg | tr -d '\n'
        • Windows PowerShell： [Convert]::ToBase64String([IO.File]::ReadAllBytes("apple.jpg"))
        • 或用線上工具（搜尋 base64 image converter）。
   3. 把那一長串文字填進下面的 img 欄位：
        img: 'data:image/jpeg;base64,這裡貼上那一長串文字'
      （PNG 圖片就寫 data:image/png;base64,…）
   【更簡單的做法】直接把圖片傳給 Claude，說「幫我換成這張」，我會幫你轉好貼上。

   ────────────────────────────────────────────────────────────────────
   步驟 B：音效檔（拼好時播放）
   ────────────────────────────────────────────────────────────────────
   • audio 留空 '' ＝ 用內建的聲音：英文女聲念單字 ＋ 節奏聲。
   • 想用自己錄的 mp3：轉成 base64（做法同步驟 A），填
        audio: 'data:audio/mpeg;base64,這裡貼上那一長串文字'
     建議檔案小於 1MB，網頁才不會變慢。也可以直接把 mp3 傳給 Claude 幫你放。

   ────────────────────────────────────────────────────────────────────
   步驟 C：新增一題
   ────────────────────────────────────────────────────────────────────
   把任何一個 { ... }, 整個複製貼到清單最後面，再改這些欄位：

     id      代號（英文，不可重複）
     emoji   上方選題按鈕的小圖示
     word    單字，按鈕會顯示，也是「發音」要念的字
     syl     音節清單。有幾個音節就會切成幾塊長方形！
             例如 ['A','pple'] 會切成兩塊，['Straw','ber','ry'] 切成三塊。
     stress  重音在第幾個音節（0 是第一個），那一塊的字會變粗體
     rhythm  節奏：q=四分 d=附點八分 e=八分 s=十六分 r=八分休止符
             例如 'ee' 兩個八分、'ds' 附點八分加十六分、'ess' 八分加兩個十六分
     bg      卡片底色（和圖片背景同色最好看）
     img     圖片（見步驟 A）
     audio   音效檔（見步驟 B），留空就用內建聲音

   ────────────────────────────────────────────────────────────────────
   其他可調的小設定（在最下面的程式裡）
   ────────────────────────────────────────────────────────────────────
     SNAP   離正確位置多近（像素）會自動吸進去，預設 30。
            小小孩可以調大一點（例如 45），比較容易成功。
   ====================================================================== */
const PUZZLES = [
  {
    id: 'pear',                  // 代號（英文，不可重複）
    emoji: '🍐', word: 'Pear',
    syl: ["Pear"],   // 單音節 → 只有一塊，最簡單的入門題
    stress: 0,                    // 重音在第幾個音節（0 是第一個），那一塊的字會變粗
    rhythm: 'er',               // 節奏：q=四分 d=附點八分 e=八分 s=十六分 r=八分休止符
    bg: '#a0c4c3',              // 卡片底色
    audio: '',                    // 【音效檔】留空＝英文女聲念單字＋節奏聲；要放自己的音檔請看上面教學
    shape: 'polygon(97.1% 3.0%, 73.3% 2.3%, 58.5% 9.0%, 54.6% 9.0%, 52.2% 4.5%, 45.8% 5.3%, 45.4% 17.7%, 37.0% 19.2%, 30.2% 22.9%, 25.3% 29.3%, 20.4% 41.7%, 8.7% 53.0%, 2.9% 64.3%, 4.8% 80.0%, 8.7% 85.7%, 16.5% 91.0%, 28.8% 95.5%, 42.5% 97.7%, 64.9% 96.6%, 80.5% 90.5%, 88.3% 83.8%, 93.2% 74.4%, 93.2% 65.4%, 89.3% 56.7%, 75.1% 41.4%, 68.8% 21.8%, 77.6% 20.6%, 86.4% 16.9%, 94.6% 9.8%)',   // 單音節：整塊剪成水果的形狀

<script>
/* ======================================================================
   🎮 【遊戲程式】一般不需要修改
   ====================================================================== */
(function(){
'use strict';

const SNAP = 30;      // 離正確位置多近（像素）就會吸進去
const SW   = 360;     // 遊戲區的內部寬度（會自動依螢幕縮放）
const BW   = 320;     // 拼好後整張圖的寬度
const BX   = (SW - BW) / 2, BY = 24;   // 整張圖在遊戲區裡的位置
const GAP  = 3;       // 方塊之間留的小縫，看得出一塊一塊

const $ = s => document.querySelector(s);
const stage = $('#stage'), wrap = $('#wrap'), picker = $('#picker'), prog = $('#prog'), card = $('#card');
const clamp = (v,a,b) => Math.max(a, Math.min(b,v));
const rand = (a,b) => a + Math.random()*(b-a);

function notes(r){
  const T=[...r]; let x=24; const pos=T.map(t=>{ const p=x; x+= t==='r'?34:(t==='d'?54:44); return p; });
  let s=`<svg viewBox="0 0 ${x+6} 96" aria-hidden="true">`;
  T.forEach((t,i)=>{ const cx=pos[i];
    if(t==='r'){ s+=`<circle cx="${cx+3}" cy="42" r="6.5" fill="#000"/><path d="M${cx+3} 40 Q${cx+16} 40 ${cx+16} 30 M${cx+16} 30 L${cx+2} 72" stroke="#000" stroke-width="4" fill="none" stroke-linecap="round"/>`; }
    else { s+=`<ellipse cx="${cx}" cy="76" rx="15" ry="10.5" transform="rotate(-22 ${cx} 76)" fill="#000"/><rect x="${cx+12}" y="14" width="3.5" height="62" fill="#000"/>`;
      if(t==='d') s+=`<circle cx="${cx+25}" cy="76" r="4.5" fill="#000"/>`;   // 附點：音符右邊的小圓點
    }
  });
  const isN=t=>t==='e'||t==='s'||t==='d';   // 可以連成一束（有符桿、有符尾）的音符
  for(let i=0;i<T.length;){
    if(!isN(T[i])){ i++; continue; }
    let j=i; while(j+1<T.length&&isN(T[j+1])) j++;
    if(j>i){
      s+=`<rect x="${pos[i]+12}" y="14" width="${pos[j]-pos[i]+3.5}" height="9" fill="#000"/>`;
      for(let k=i;k<=j;k++){ if(T[k]!=='s') continue;
        if(k<j&&T[k+1]==='s') s+=`<rect x="${pos[k]+12}" y="28" width="${pos[k+1]-pos[k]+3.5}" height="6" fill="#000"/>`;
        else if(!(k>i&&T[k-1]==='s')) s+= k>i ? `<rect x="${pos[k]-2}" y="28" width="14.5" height="6" fill="#000"/>` : `<rect x="${pos[k]+12}" y="28" width="14" height="6" fill="#000"/>`; }
    } else if(T[i]==='e'||T[i]==='d'){ const x0=pos[i]+12; s+=`<path d="M${x0} 14 C${x0+4} 24 ${x0+22} 30 ${x0+16} 52 C${x0+16} 40 ${x0+6} 36 ${x0} 34 Z" fill="#000"/>`; }
    i=j+1;
  }
  return s+'</svg>';
}   /* 畫音符的函式（和「節奏查詢」頁面同一份） */

/* ── 速度設定 ─────────────────────────────────── */
const BEATS = {q:1, d:.75, e:.5, s:.25, r:.5};
let BPM = (()=>{ try{ return +localStorage.getItem('rs_bpm') || 90; }catch(e){ return 90; } })();
let ONEBEAT = (()=>{ try{ return localStorage.getItem('rs_onebeat') !== '0'; }catch(e){ return true; } })();
function timing(r){
  const arr=[...r], total=arr.reduce((a,k)=>a+BEATS[k],0)||1;
  const beat=60/BPM, scale=ONEBEAT ? 1/total : 1;
  return arr.map(k => BEATS[k]*scale*beat);
}
(function(){
  const sl=$('#bpm'), ov=$('#bpmv'), ob=$('#onebeat');
  const show=()=>{ ov.textContent = BPM + ' BPM'; };
  sl.value=BPM; ob.checked=ONEBEAT; show();
  sl.addEventListener('input',()=>{ BPM=+sl.value; show(); try{ localStorage.setItem('rs_bpm',BPM); }catch(e){} });
  ob.addEventListener('change',()=>{ ONEBEAT=ob.checked; try{ localStorage.setItem('rs_onebeat',ONEBEAT?'1':'0'); }catch(e){} });
})();

/* ── 聲音 ─────────────────────────────────────── */
let ac;
function audioCtx(){ ac = ac || new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==='suspended') ac.resume(); return ac; }
const FEM=['samantha','ava','allison','susan','victoria','karen','moira','tessa','fiona','serena','zira','jenny','aria','google us english','female'];
function pickVoice(){
  const v=(window.speechSynthesis?speechSynthesis.getVoices():[]).filter(x=>/^en/i.test(x.lang));
  for(const n of FEM){ const f=v.find(x=>x.name.toLowerCase().includes(n)&&/^en[-_]US/i.test(x.lang))||v.find(x=>x.name.toLowerCase().includes(n)); if(f) return f; }
  return v.find(x=>/^en[-_]US/i.test(x.lang))||v[0]||null;
}
function say(text,then){
  let fired=false; const go=()=>{ if(!fired){ fired=true; then&&then(); } };
  try{ const u=new SpeechSynthesisUtterance(text); u.lang='en-US';
    const v=pickVoice(); if(v){ u.voice=v; u.lang=v.lang; }
    u.rate=.85; u.pitch=1.15; u.onend=go; u.onerror=go;
    speechSynthesis.cancel(); speechSynthesis.speak(u); setTimeout(go,2600);
  }catch(e){ go(); }
}
function playRhythm(r,stress){
  try{
    const c=audioCtx(), dur=timing(r); let t=c.currentTime+.05, n=0;
    [...r].forEach((k,i)=>{ const d=dur[i];
      if(k!=='r'){ const o=c.createOscillator(), g=c.createGain(), st=n===stress; n++;
        o.type='triangle'; o.frequency.value= st?660:440;
        const len=Math.max(.08,Math.min(d*.9,.5));
        g.gain.setValueAtTime(st?.5:.3,t); g.gain.exponentialRampToValueAtTime(.001,t+len);
        o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+len+.02); }
      t+=d; });
  }catch(e){}
}
function sfxPop(){
  try{ const c=audioCtx(), o=c.createOscillator(), g=c.createGain(), t=c.currentTime;
    o.type='sine'; o.frequency.setValueAtTime(520,t); o.frequency.exponentialRampToValueAtTime(820,t+.1);
    g.gain.setValueAtTime(.35,t); g.gain.exponentialRampToValueAtTime(.001,t+.16);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+.18); }catch(e){}
}
function saySyl(s){ say(s); }                 // 放對一塊時念那個音節
let curAudio;
function playFinish(p){                        // 拼好時：念整個單字＋節奏
  try{ speechSynthesis.cancel(); }catch(e){}
  if(curAudio){ curAudio.pause(); curAudio=null; }
  if(p.audio){ curAudio=new Audio(p.audio); curAudio.play().catch(fallback); } else fallback();
  function fallback(){ say(p.word, ()=> setTimeout(()=>playRhythm(p.rhythm,p.stress),180)); }
}

/* ── 進度存在瀏覽器裡 ─────────────────────────── */
const loadDone=()=>{ try{ return new Set(JSON.parse(localStorage.getItem('pz_done')||'[]')); }catch(e){ return new Set(); } };
const saveDone=s=>{ try{ localStorage.setItem('pz_done',JSON.stringify([...s])); }catch(e){} };
const doneSet=loadDone();

/* ── 狀態 ─────────────────────────────────────── */
let idx=0, puz, SH=540, k=1, BH=240, pieces=[], drag=null, finished=false, zTop=10, board, solvedH=0;

function renderPicker(){
  picker.innerHTML = PUZZLES.map((p,i)=>
    `<button class="chip" data-i="${i}" aria-pressed="${i===idx}">${p.emoji} ${p.word}${doneSet.has(p.id)?' ⭐':''}</button>`).join('');
}
picker.addEventListener('click', e=>{ const b=e.target.closest('.chip'); if(b) load(+b.dataset.i); });

function fit(){
  const w = wrap.clientWidth; k = Math.min(w/SW, 1.45);
  const h = solvedH || SH;                      // 拼完後把空掉的碎片區收起來
  stage.style.transform = `scale(${k})`; stage.style.height = h+'px'; wrap.style.height = (h*k)+'px';
}
addEventListener('resize', fit);

function load(i){
  idx=i; puz=PUZZLES[i]; finished=false; pieces=[]; drag=null; zTop=10; solvedH=0;
  stage.innerHTML=''; stage.classList.remove('done'); card.hidden=true;
  const n = puz.syl.length;
  BH = Math.round(BW * 0.62);                 // 整張圖的高度
  // 每一塊的寬度照它那個音符的實際時值分：附點八分比十六分寬三倍，
  // 所以 Or|ange 的前面那塊長、後面那塊短，看得出長短音。
  // 把節奏拆成一格一格：發聲的音符配一個音節，休止符自己也是一格（安靜方塊）
  const cells = []; let sy = 0;
  [...puz.rhythm].forEach(k => {
    if(k === '|') return;
    if(k === 'r') cells.push({ rest:true,  w:BEATS[k] });
    else          cells.push({ rest:false, w:BEATS[k], j:sy++ });
  });
  const nc = cells.length;
  const sumW = cells.reduce((a,c)=>a+c.w, 0) || 1;
  const avail = BW - GAP*(nc-1);
  cells.forEach(c => { c.pw = avail * c.w / sumW; });
  { let a=0; cells.forEach(c => { c.x = a; a += c.pw + GAP; }); }   // 每一格的左邊位置
  const trayTop = BY + BH + 46; SH = Math.round(trayTop + BH + 56);

  // 目標組裝區：黃色虛線大框 + 每一塊的淡色空格
  const frame=document.createElement('div'); frame.className='frame';
  Object.assign(frame.style,{left:(BX-10)+'px',top:(BY-10)+'px',width:(BW+20)+'px',height:(BH+20)+'px'});
  frame.innerHTML='<div class="frame-label">⬇ 照順序拼在這裡</div>'; stage.appendChild(frame);
  board=document.createElement('div'); board.className='board';
  Object.assign(board.style,{left:BX+'px',top:BY+'px',width:BW+'px',height:BH+'px'}); stage.appendChild(board);

  const tray=document.createElement('div'); tray.className='tray';
  Object.assign(tray.style,{left:'6px',top:trayTop+'px',width:(SW-12)+'px',height:(SH-trayTop-6)+'px'});
  tray.innerHTML='<div class="tray-label">🧩 音節方塊在這裡，拖上去吧！</div>'; stage.appendChild(tray);

  // 字級要讓「最窄的那一塊」也放得下它的音節
  const fits = cells.filter(c=>!c.rest).map(c => c.pw / Math.max(2.2, puz.syl[c.j].length*0.58));
  const fontPx = Math.max(12, Math.min(30, BH*0.2, Math.min(...fits)));
  const shaped = (n === 1 && !!puz.shape);                    // 單音節才剪外形
  const LABEL = Math.round(Math.max(fontPx*1.5, BH*0.24));   // 下方放字的純色字條高度
  const imgH  = shaped ? BH : BH - LABEL;                     // 剪外形時圖片填滿整塊
  // 碎片區：把方塊打亂順序後排成一排（手機上也排得下）
  const order = cells.map((_,i)=>i).sort(()=>Math.random()-.5);
  const tgap = Math.min(10, (SW - 20 - avail)/Math.max(1,nc-1));
  const startX = (SW - (avail + (nc-1)*tgap)) / 2;
  const trayY = trayTop + 32;
  let trayX = startX;
  order.forEach((ci,slotIdx)=>{
    const cell = cells[ci], j = cell.j;
    let pw = cell.pw, bh = BH, tx = BX + cell.x, ty = BY;
    // 剪成水果外形的那一塊，要照水果本身的長寬比縮放，不要被拉扁
    if(shaped && !cell.rest){
      const fitW = Math.min(pw, BH * puz.shapeAR);
      const fitH = fitW / puz.shapeAR;
      tx += (pw - fitW)/2; ty += (BH - fitH)/2; pw = fitW; bh = fitH;
    }
    const slot=document.createElement('div'); slot.className='slot';
    Object.assign(slot.style,{left:tx+'px',top:ty+'px',width:pw+'px',height:bh+'px'});
    if(cell.rest) slot.classList.add('rest-slot');
    else if(shaped){ slot.classList.add('shaped'); slot.style.clipPath = puz.shape; }
    stage.appendChild(slot);

    const best={ L: trayX, T: trayY }; trayX += pw + tgap;

    const el=document.createElement('div');
    el.className = 'piece' + (cell.rest ? ' rest' : '');
    el.setAttribute('role','img');
    el.setAttribute('aria-label', cell.rest ? '安靜一拍（休止符）' : ('音節 '+puz.syl[j]));
    Object.assign(el.style,{ left:best.L+'px', top:best.T+'px', width:pw+'px', height:bh+'px',
      zIndex:++zTop, fontSize:fontPx+'px' });
    if(!cell.rest) Object.assign(el.style,{
      backgroundColor:puz.bg, backgroundImage:`url(${puz.img})`, backgroundRepeat:'no-repeat',
      backgroundSize: shaped ? `${pw}px ${bh}px` : `${BW}px ${imgH}px`,
      backgroundPosition: shaped ? '0 0' : `${-cell.x}px 0` });
    if(cell.rest){
      el.innerHTML = `<svg class="rs" viewBox="0 0 24 36" aria-hidden="true">
          <path d="M15.6 3.4 L9.4 32.6 L6.6 32 L12.8 2.8 Z"/>
          <circle cx="8.3" cy="10.2" r="4.4"/>
          <path d="M8.3 5.8 Q13.4 5.2 15.2 9.6 L12.3 10.9 Q11.3 7.9 8.3 8.5 Z"/>
        </svg><span class="rt">噓…安靜</span>`;
    } else if(shaped){
      el.classList.add('shaped'); el.style.clipPath = puz.shape;
      el.innerHTML = `<span class="pill" style="font-weight:${j===puz.stress?700:400}">${puz.syl[j]}</span>`;
    } else {
      el.innerHTML = `<span style="height:${LABEL}px;font-weight:${j===puz.stress?700:400}">${puz.syl[j]}</span>`;
    }
    stage.appendChild(el);
    pieces.push({ j: ci, syl: cell.j, el, slot, pw, bh, tx, ty, rest:cell.rest,
                  left:best.L, top:best.T, z:zTop, locked:false });
  });
  pieces.sort((a,b)=>a.j-b.j);
  renderPicker(); renderProg(); fit();
}

function renderProg(){
  const n=pieces.filter(p=>p.locked).length;
  prog.innerHTML = pieces.map(p=>`<span class="dot${p.locked?' on':''}"></span>`).join('')+`<span>已拼好 ${n} / ${pieces.length}</span>`;
}

/* ── 拖曳：滑鼠、手指、觸控筆通用 ───────────────── */
function toLogical(e){ const r=stage.getBoundingClientRect(); return { x:(e.clientX-r.left)/k, y:(e.clientY-r.top)/k }; }
function pick(pt){
  return pieces.filter(p=>!p.locked).sort((a,b)=>b.z-a.z)
    .find(p => pt.x>=p.left-6 && pt.x<=p.left+p.pw+6 && pt.y>=p.top-6 && pt.y<=p.top+p.bh+6) || null;
}
const place=p=>{ p.el.style.left=p.left+'px'; p.el.style.top=p.top+'px'; };
const dist=p=>Math.hypot(p.left-p.tx, p.top-p.ty);

stage.addEventListener('pointerdown', e=>{
  if(finished||drag) return;
  try{ audioCtx(); }catch(_){}
  const pt=toLogical(e), p=pick(pt); if(!p) return;
  drag={p,id:e.pointerId,ox:pt.x-p.left,oy:pt.y-p.top};
  stage.setPointerCapture(e.pointerId);
  p.z=++zTop; p.el.style.zIndex=p.z; p.el.classList.add('drag'); p.el.classList.remove('wiggle','pop');
  e.preventDefault();
});
stage.addEventListener('pointermove', e=>{
  if(!drag||e.pointerId!==drag.id) return;
  const pt=toLogical(e), p=drag.p;
  p.left=clamp(pt.x-drag.ox, -p.pw*.4, SW-p.pw*.6);
  p.top =clamp(pt.y-drag.oy, -p.bh*.3, SH-p.bh*.5);
  place(p); p.slot.classList.toggle('near', dist(p)<70);
  e.preventDefault();
});
function release(e){
  if(!drag||e.pointerId!==drag.id) return;
  const p=drag.p; drag=null; p.el.classList.remove('drag'); p.slot.classList.remove('near');
  if(dist(p)<SNAP) snap(p);
  else if(dist(p)<95){ void p.el.offsetWidth; p.el.classList.add('wiggle'); }
}
stage.addEventListener('pointerup', release);
stage.addEventListener('pointercancel', release);

function snap(p){
  p.locked=true; p.left=p.tx; p.top=p.ty;
  p.el.classList.add('snap','locked','pop'); place(p); p.el.style.zIndex=2;
  sfxPop(); renderProg();
  if(pieces.every(q=>q.locked)) finish();
  else if(!p.rest) saySyl(puz.syl[p.syl]);   // 放對一塊，就念那一個音節（休止符不念）
}

/* ── 拼好：跳出來＋念整個單字 ─────────────────── */
function finish(){
  finished=true; stage.classList.add('done');
  solvedH = BY + BH + 26; fit();                // 碎片區收起來，不留一大片空白
  doneSet.add(puz.id); saveDone(doneSet); renderPicker();
  board.classList.remove('cheer'); void board.offsetWidth; board.classList.add('cheer');   // 整張圖「跳」一下
  pieces.forEach(p=>{ p.el.style.transition='transform .7s cubic-bezier(.2,1.5,.4,1)'; });
  setTimeout(()=>playFinish(puz), 250);      // 念出整個單字＋節奏
  const win=document.createElement('div'); win.className='win';
  const em=['⭐','🎉','🎵','🌟','🎶','💛','🐛','🦋'];
  win.innerHTML='<div class="banner"><b>🎉 太棒了！</b><span>'+puz.word+'</span></div><div class="confetti">'+
    Array.from({length:32},()=>`<i style="left:${rand(2,96).toFixed(1)}%;--d:${rand(2.2,4).toFixed(2)}s;--dl:${rand(0,1.2).toFixed(2)}s">${em[Math.floor(Math.random()*em.length)]}</i>`).join('')+'</div>';
  stage.appendChild(win); setTimeout(()=>win.remove(),4600);
  const text=puz.syl.map((s,i)=> i===puz.stress?`<b>${s}</b>`:s).join(' ');
  card.style.background=puz.bg; card.hidden=false;
  card.innerHTML = notes(puz.rhythm)+`<div class="syl">${text}</div><div class="bar"><button class="btn" id="again">🔊 再聽一次</button><button class="btn green" id="next2">➡ 下一題</button></div>`;
  $('#again').onclick=()=>{ audioCtx(); playFinish(puz); };
  $('#next2').onclick=nextPuzzle;
}

function nextPuzzle(){ load((idx+1)%PUZZLES.length); }
$('#next').onclick=nextPuzzle;
$('#reset').onclick=()=>load(idx);
$('#hint').onclick=()=>{
  const left=pieces.filter(p=>!p.locked); if(!left.length) return;
  const p=left[Math.floor(Math.random()*left.length)];
  p.slot.classList.remove('near'); void p.slot.offsetWidth; p.slot.classList.add('near');
  setTimeout(()=>p.slot.classList.remove('near'),1400);
  if(!p.rest) saySyl(puz.syl[p.syl]);
};

try{ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices(); }catch(e){}
load(0);
})();
</script>
