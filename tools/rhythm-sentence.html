<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rhythm Finder · Sentence｜節奏查詢 · 造句</title>
<style>
  :root{ color-scheme:light dark; --page:#f3f4f6; --ink:#1f2937; --muted:#4b5563; --panel:#fff; --line:#d1d5db; box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --page:#111418; --ink:#e5e7eb; --muted:#9ca3af; --panel:#1b2027; --line:#374151; } }
  :root[data-theme="dark"]{ --page:#111418; --ink:#e5e7eb; --muted:#9ca3af; --panel:#1b2027; --line:#374151; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--page); color:var(--ink); font-family:"Noto Sans TC","PingFang TC",system-ui,sans-serif; }
  .hero{ background:linear-gradient(135deg,#5b21b6 0%,#0e7490 65%,#15803d 100%); color:#fff; text-align:center; padding:2.5rem 1.25rem; position:relative; overflow:hidden; }
  .hero h1{ margin:0; font-size:clamp(1.6rem,6vw,2.4rem); }
  .hero p{ margin:.5rem 0 0; color:#fde68a; }
  .fl{ position:absolute; animation:bob 5s ease-in-out infinite; font-size:2rem; pointer-events:none; }
  @keyframes bob{ 50%{ transform:translateY(-10px) rotate(6deg); } }
  @media (prefers-reduced-motion:reduce){ .fl{ animation:none; } }
  main{ max-width:64rem; margin:0 auto; padding:1.5rem 1rem 3rem; }
  .panel{ background:var(--panel); border-radius:1rem; box-shadow:0 2px 10px rgba(0,0,0,.08); padding:1rem; margin-bottom:1.25rem; }
  h2{ margin:0 0 .6rem; font-size:1rem; }
  .chips{ display:flex; flex-wrap:wrap; gap:.5rem; }
  .chip{ background:#f6d092; color:#000; border:3px solid transparent; border-radius:.75rem; padding:.3rem .6rem; cursor:pointer; font:inherit; font-weight:600; display:flex; flex-direction:column; align-items:center; min-width:4.2rem; }
  .chip[aria-pressed="true"]{ border-color:#5b21b6; }
  .chip svg{ height:38px; width:auto; }
  .chip.all{ justify-content:center; }
  input{ width:100%; font:inherit; padding:.7rem .9rem; border-radius:.6rem; border:1px solid var(--line); background:var(--page); color:var(--ink); }
  .hint{ color:var(--muted); font-size:.85rem; line-height:1.55; margin:.5rem 0 0; max-width:34rem; }
  .grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:.9rem; }
  @media (min-width:640px){ .grid{ grid-template-columns:repeat(3,1fr); } }
  @media (min-width:960px){ .grid{ grid-template-columns:repeat(4,1fr); } }
  .card{ background:#f6d092; color:#000; border-radius:1rem; padding:.6rem .6rem .7rem; text-align:center; display:flex; flex-direction:column; align-items:center; gap:.3rem; }
  .card svg{ height:78px; width:auto; max-width:100%; }
  .pic{ width:100%; height:104px; display:flex; align-items:center; justify-content:center; font-size:3.4rem; }
  .pic img{ width:100%; height:100%; object-fit:contain; display:block; }
  .syl{ font-family:"Times New Roman",Times,serif; font-size:1.6rem; line-height:1.2; }
  .syl b{ font-weight:700; }
  .play{ margin-top:.3rem; background:#e5e7eb; color:#374151; border:0; border-radius:.5rem; padding:.35rem .9rem; font:inherit; font-size:.85rem; cursor:pointer; }
  .play:hover{ background:#d1d5db; }
  .chip:focus-visible,.play:focus-visible,input:focus-visible{ outline:3px solid #6aa84f; outline-offset:2px; }
  .empty{ color:var(--muted); padding:1rem 0; grid-column:1/-1; }
  .tempo{ display:flex; align-items:center; gap:.7rem; flex-wrap:wrap; }
  .tempo input[type=range]{ flex:1; min-width:9rem; accent-color:#5b21b6; height:2rem; }
  .tempo output{ font-weight:600; min-width:5.5rem; }
  .tempo label{ display:flex; align-items:center; gap:.45rem; font-size:.92rem; width:100%; }
  .tempo input[type=checkbox]{ width:1.15rem; height:1.15rem; accent-color:#5b21b6; }
  .adv{ display:flex; align-items:center; gap:.8rem; flex-wrap:wrap; }
  .advlab{ font-size:.92rem; font-weight:600; }
  .segs{ display:flex; flex-wrap:wrap; gap:.4rem; }
  .seg{ font:inherit; font-size:.88rem; border:1px solid var(--line); background:var(--page); color:var(--ink);
    border-radius:999px; padding:.4rem .9rem; min-height:2.4rem; cursor:pointer; }
  .seg:hover{ background:var(--panel); }
  .seg[aria-pressed="true"]{ background:#5b21b6; border-color:#5b21b6; color:#fff; }
  .seg:focus-visible{ outline:3px solid #6aa84f; outline-offset:2px; }
  .art{ opacity:.6; font-style:italic; }
  .wide{ grid-column:1/-1; }
  .sent{ display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:center; gap:.2rem 1.1rem; }
  .sw{ display:flex; flex-direction:column; align-items:center; gap:.1rem; }
  .sw svg{ height:66px; width:auto; }
  .sw .t{ font-family:"Times New Roman",Times,serif; font-size:1.5rem; line-height:1.1; }
  .sw .t b{ font-weight:700; }
  .sw.fn .t{ opacity:.6; font-style:italic; }

  .cap{ font-size:.8rem; opacity:.75; }
  .btns{ display:flex; gap:.4rem; flex-wrap:wrap; justify-content:center; margin-top:.3rem; }
  .btns .play{ margin-top:0; }
  .custom{ outline:3px dashed #5b21b6; }
</style>
</head>
<body>
<header class="hero">
  <span class="fl" style="left:6%;top:18%" aria-hidden="true">🍎</span>
  <span class="fl" style="left:24%;top:62%;animation-delay:.8s" aria-hidden="true">♪</span>
  <span class="fl" style="left:70%;top:14%;animation-delay:1.4s" aria-hidden="true">♫</span>
  <span class="fl" style="left:88%;top:58%;animation-delay:.4s" aria-hidden="true">🍊</span>
  <h1>Rhythm Finder · Sentence</h1>
  <p>節奏查詢 · 造句　Advanced</p>
</header>
<main>
          <section class="panel">
    <h2>整句練習 Whole sentence</h2>
    <input id="sent" type="text" placeholder="He ate a green apple." autocomplete="off" aria-label="整句 Whole sentence">
    <p class="hint">打一整句：重音踩在拍點上，輕音擠進拍子裡。<br>Type a sentence — stressed syllables land on the beat; light syllables squeeze in between.</p>
  </section>
    <section>
    <div id="count" class="hint" style="margin-bottom:.6rem"></div>
    <div class="grid" id="results"></div>
    <p class="hint" style="margin-top:1.5rem;text-align:center">Syllable &amp; stress data: CMU Pronouncing Dictionary (Carnegie Mellon University).</p>
  </section>
</main>

  const n = syls.length, w = syls[0].w;
  if(syls.every(s=>s.w===w) && w.syl.length===n && META[w.key]) return META[w.key];   // 圖卡上的字
  if(n===1) return (w.syl.length===1 && shortOne(w.key)) ? 'er' : 'q';               // 一拍只有一個音節
  return GROUP_R[n] || 's'.repeat(n);
}
// words：[{ key, syl:[音節…], stress: 重音在第幾個音節（虛詞用 -1，整個字都輕） }]
function stressTimed(words){
  const S = [];
  words.forEach(w => w.syl.forEach((t,i) => S.push({ t, w, i, str: w.stress===i })));
  if(!S.length) return null;
  if(!S.some(s=>s.str)){                         // 整句都是輕音（例如只打 I am）：最後一個字當重音
    const last = words[words.length-1], k = Math.max(0, last.stress);
    S.find(s=>s.w===last && s.i===k).str = true;
  }
  const first = S.findIndex(s=>s.str), groups = [];
  if(first>0){ const lead = S.slice(0,first); groups.push({ syls:lead, r: LEAD_R[lead.length] || 's'.repeat(lead.length), lead:true }); }
  for(let i=first; i<S.length; ){
    let j=i+1; while(j<S.length && !S[j].str) j++;
    const syls = S.slice(i,j); groups.push({ syls, r: beatRhythm(syls), lead:false }); i=j;
  }
  const r = groups.map(g=>g.r).join('|');
  const acc = [];                                 // 每個符號是不是重音（播放時重音比較高、比較大聲）
  groups.forEach((g,gi)=>{ if(gi>0) acc.push(false); let n=0;
    [...g.r].forEach(k=>{ if(k==='r'){ acc.push(false); return; } const s=g.syls[n++]; acc.push(!!(s && s.str)); }); });
  const leadLen = groups[0].lead ? groups[0].r.length + 1 : 0;   // 弱起拍佔前面幾個符號（含 '|'）
  return { r, acc, groups, leadLen };
}
function wordRhythm(key, syl, stress){ return stressTimed([{ key, syl, stress }]); }   // 單一個字
function parse(w){
  const parts = w.split('-'); let stress = 0;
  const syl = parts.map((p,i)=>{ if(p.startsWith('^')){ stress=i; p=p.slice(1);} return p.replace(/~/g,' '); });
  const key = syl.join('').toLowerCase().replace(/\s+/g,'');
  const wr = wordRhythm(key, syl, stress);
  return { syl, stress, key, r: wr.r, lead: wr.leadLen, acc: wr.acc, bg: PICS[key]?PICS[key].bg:'#f6d092', img: PICS[key]?PICS[key].src:'', emoji: EMO[key]||'' };
}
const ITEMS = WORDS.map(parse);

function notes(r){
  const T=[...r]; let x=24; const pos=T.map(t=>{ const p=x; x+= t==='|'?16:(t==='r'?34:(t==='d'?54:44)); return p; });
  let s=`<svg viewBox="0 0 ${x+6} 96" aria-hidden="true">`;
  T.forEach((t,i)=>{ const cx=pos[i];
    if(t==='|'){ /* 只是一個小間隔，不畫任何東西，用來把弱起拍和單字分開 */ }
    else if(t==='r'){ s+=`<circle cx="${cx+3}" cy="42" r="6.5" fill="#000"/><path d="M${cx+3} 40 Q${cx+16} 40 ${cx+16} 30 M${cx+16} 30 L${cx+2} 72" stroke="#000" stroke-width="4" fill="none" stroke-linecap="round"/>`; }
    else { s+=`<ellipse cx="${cx}" cy="76" rx="15" ry="10.5" transform="rotate(-22 ${cx} 76)" fill="#000"/><rect x="${cx+12}" y="14" width="3.5" height="62" fill="#000"/>`;
      if(t==='d') s+=`<circle cx="${cx+25}" cy="76" r="4.5" fill="#000"/>`;   // 附點：音符右邊的小圓點
    }
  });
  const isN=t=>t==='e'||t==='s'||t==='d';   // 可以連成一束（有符桿、有符尾）的音符；'|' 不是，所以會斷開
  for(let i=0;i<T.length;){
    if(!isN(T[i])){ i++; continue; }
    let j=i; while(j+1<T.length&&isN(T[j+1])) j++;
    if(j>i){
      s+=`<rect x="${pos[i]+12}" y="14" width="${pos[j]-pos[i]+3.5}" height="9" fill="#000"/>`;
      for(let k=i;k<=j;k++){ if(T[k]!=='s') continue;
        if(k<j&&T[k+1]==='s') s+=`<rect x="${pos[k]+12}" y="28" width="${pos[k+1]-pos[k]+3.5}" height="6" fill="#000"/>`;
        else if(!(k>i&&T[k-1]==='s')) s+= k>i ? `<rect x="${pos[k]-2}" y="28" width="14.5" height="6" fill="#000"/>` : `<rect x="${pos[k]+12}" y="28" width="14" height="6" fill="#000"/>`; }
    } else if(T[i]==='e'||T[i]==='d'){ const x0=pos[i]+12; s+=`<path d="M${x0} 14 C${x0+4} 24 ${x0+22} 30 ${x0+16} 52 C${x0+16} 40 ${x0+6} 36 ${x0} 34 Z" fill="#000"/>`; }
    i=j+1;
  }
  return s+'</svg>';
}
let ctx;

const FEM=['samantha','ava','allison','susan','victoria','karen','moira','tessa','fiona','serena','zira','jenny','aria','google us english','female'];
function pickVoice(){
  const v=(window.speechSynthesis?speechSynthesis.getVoices():[]).filter(x=>/^en/i.test(x.lang));
  for(const n of FEM){ const f=v.find(x=>x.name.toLowerCase().includes(n)&&/^en[-_]US/i.test(x.lang))||v.find(x=>x.name.toLowerCase().includes(n)); if(f) return f; }
  return v.find(x=>/^en[-_]US/i.test(x.lang))||v[0]||null;
}
function say(t){ try{ const u=new SpeechSynthesisUtterance(t); u.lang='en-US'; const v=pickVoice(); if(v){ u.voice=v; u.lang=v.lang; } u.rate=.85; u.pitch=1.15; speechSynthesis.cancel(); speechSynthesis.speak(u); }catch(e){} }
try{ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices(); }catch(e){}
try{ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices(); }catch(e){}

/* ===== 速度設定 Tempo =========================================================
   BEATS：每個音符佔幾拍（q=1拍、d=附點八分=3/4拍、e=半拍、s=1/4拍、r=半拍休止）
   ONEBEAT = true 時「一個單字＝一拍」：整個字會被壓縮成剛好一拍，
             所以三音節的字會變成一拍三連音，四音節變成一拍四個音。
   ONEBEAT = false 時就照音符本身的長度走。
   BPM：每分鐘幾拍，使用者可以自己拉。 */
const BEATS = {q:1, d:.75, e:.5, s:.25, r:.5, '|':0};
let BPM = (()=>{ try{ return +localStorage.getItem('rs_bpm') || 90; }catch(e){ return 90; } })();
let ONEBEAT = (()=>{ try{ return localStorage.getItem('rs_onebeat') !== '0'; }catch(e){ return true; } })();
function timing(r, lead){                 // 算出這個節奏每個音符要響多久（秒）
  // lead = 前面幾個符號是「弱起拍」（冠詞）。弱起拍照自己的長度走，
  // 不跟著「一個單字一拍」被壓縮，否則加了冠詞整個字會被擠小。
  const arr = [...r]; lead = lead || 0;
  const body = arr.slice(lead);
  const total = body.reduce((a,k)=>a+BEATS[k], 0) || 1;
  const beat = 60/BPM, scale = ONEBEAT ? 1/total : 1;
  return arr.map((k,i) => BEATS[k] * (i<lead ? 1 : scale) * beat);
}
function play(it){
  ctx = ctx || new (window.AudioContext||window.webkitAudioContext)();
  if(ctx.state==='suspended') ctx.resume();
  const arr=[...it.r], dur = it.sentence ? sentenceDur(it) : timing(it.r, it.lead);
  let t=ctx.currentTime+.05, n=0;
  arr.forEach((k,i)=>{ const d=dur[i];
    if(k!=='r' && k!=='|'){
      const o=ctx.createOscillator(), g=ctx.createGain();
      const st = it.acc ? !!it.acc[i] : (n===it.stress); n++;
      o.type='triangle'; o.frequency.value= st?660:440;
      const len=Math.max(.08,Math.min(d*.9,.5));
      g.gain.setValueAtTime(st?.5:.3,t); g.gain.exponentialRampToValueAtTime(.001,t+len);
      o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t+len+.02); }
    t+=d; });
}
const ONSETS=['bl','br','cl','cr','dr','fl','fr','gl','gr','pl','pr','sl','sm','sn','sw','tr','tw','wh','ch','sh','th','ph','kn','wr','qu','str','spr','spl','scr','thr','shr'];
const EXC={science:'sci-ence',people:'peo-ple',idea:'i-de-a',area:'ar-e-a',create:'cre-ate',real:'re-al',quiet:'qui-et',poem:'po-em',every:'ev-ery',business:'busi-ness'};
function syllabifyRule(word){
  const orig=word.replace(/[^A-Za-z]/g,''), w=orig.toLowerCase(); if(!w) return [];
  if(Object.prototype.hasOwnProperty.call(EXC,w)){ let o=0; return EXC[w].split('-').map(p=>{ const t=orig.slice(o,o+p.length); o+=p.length; return t; }); }
  if(/^.*[aeiouy].*ing$/.test(w)&&/[aeiouy]/.test(w.slice(0,-3))){
    let stem=orig.slice(0,-3), tail=orig.slice(-3);
    const t=stem.toLowerCase();
    if(t.length>2&&t[t.length-1]===t[t.length-2]&&!'aeiouy'.includes(t[t.length-1])){ tail=stem.slice(-1)+tail; stem=stem.slice(0,-1); }  // runn+ing -> run+ning
    return [...syllabifyRule(stem),tail];
  }
  const isV=(c,i)=> c==='y' ? (i>0&&(w[i+1]===undefined||!'aeiou'.includes(w[i+1]))) : 'aeiou'.includes(c);
  let g0=[];
  for(let i=0;i<w.length;){ if(isV(w[i],i)){ let j=i; while(j<w.length&&isV(w[j],j)) j++; g0.push([i,j]); i=j; } else i++; }
  let g=[];
  for(const [st,en] of g0){
    const p=w.slice(st,en), pv=w[st-1]||'#', nx=w[en]||'';
    let cut=-1;
    if(en-st===2){
      if(p==='io'&&!('tscg'.includes(pv)&&nx==='n')) cut=st+1;
      else if(p==='ia'&&!('tcs'.includes(pv)&&nx&&'ln'.includes(nx))) cut=st+1;
      else if(p==='iu'||p==='eo'||p==='uo'||p==='ii') cut=st+1;
      else if(p==='ua'&&!'qg'.includes(pv)) cut=st+1;
      else if(p==='ie'&&/^ie(t|ty|ties|nce|nces|nt|nts)$/.test(w.slice(st))&&!'tc'.includes(pv)) cut=st+1;
    } else if(p==='iou'&&!'ctxg'.includes(pv)) cut=st+1;
    if(cut>0) g.push([st,cut],[cut,en]); else g.push([st,en]);
  }
  const cle=/[^aeiouy]le$/.test(w);
  if(g.length>1){ const L=g[g.length-1];
    if(L[1]===w.length&&w.slice(L[0])==='e'&&!cle) g.pop();
    else if(/[^td]ed$/.test(w)&&L[0]===w.length-2) g.pop();
    else if(/es$/.test(w)&&!/(s|x|z|ch|sh|c|g)es$/.test(w)&&L[0]===w.length-2) g.pop(); }
  if(g.length<2) return [orig];
  const cuts=[0];
  for(let k=1;k<g.length;k++){
    const a=g[k-1][1], b=g[k][0], c=b-a; let cut;
    if(k===g.length-1&&cle&&b===w.length-1) cut=w.length-3;
    else if(c===0) cut=b;
    else if(w[b-1]==='x') cut=b;
    else if(c===1) cut=b-1;
    else { let o=1; for(const n of [3,2]){ if(c>=n&&ONSETS.includes(w.slice(b-n,b))){ o=n; break; } } cut=b-o; }
    cuts.push(Math.max(cut,cuts[cuts.length-1]+1));
  }
  cuts.push(w.length);
  return cuts.slice(0,-1).map((c,i)=>orig.slice(c,cuts[i+1])).filter(Boolean);
}
function autoItem(v){
  const syl=[]; v.split(/\s+/).filter(Boolean).forEach(x=>syl.push(...syllabify(x)));
  if(!syl.length) return null;
  const key = keyOf(v), stress = v.trim().split(/\s+/).length===1 ? stressOf(v,syl.length) : 0;
  const wr = wordRhythm(key, syl, stress);
  return { word:v, syl, stress, key, r: wr.r, lead: wr.leadLen, acc: wr.acc, bg:'#f6d092', img:'', emoji:'', cap:'自動辨識 Auto-detected' };
}
let filterR = '';
const chips=document.getElementById('chips'), res=document.getElementById('results'), q=document.getElementById('q'), count=document.getElementById('count');
const patterns=[...new Set(ITEMS.map(i=>i.r))].sort((a,b)=>a.length-b.length||a.localeCompare(b));
if(chips){           // 造句版沒有「選節奏」這一區，所以要先確認它在不在
  chips.innerHTML = `<button class="chip all" data-r="" aria-pressed="true">全部 All</button>` +
    patterns.map(p=>`<button class="chip" data-r="${p}" aria-pressed="false" aria-label="rhythm ${p}">${notes(p)}<span>${ITEMS.filter(i=>i.r===p).length}</span></button>`).join('');
  chips.addEventListener('click',e=>{ const b=e.target.closest('.chip'); if(!b) return;
    filterR=b.dataset.r; chips.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',c===b)); render(); });
}
if(q) q.addEventListener('input',render);

/* ===== 冠詞 Article ==========================================================
   ARTICLE = ''（不加）、'auto'（自動選 a 或 an）、'and'、'the'。
   加上去之後，節奏前面會多 'r'（八分休止）+ 'e'（冠詞，八分音符）+ '|'（間隔），
   重音位置往後移一個，所以念起來重音還是在名詞上。 */
let ARTICLE = (()=>{ try{ const v=localStorage.getItem('rs2_article'); return v===null?'auto':v; }catch(e){ return 'auto'; } })();
const AN_YES = ['hour','honest','honour','honor','heir','mp3','fbi'];          // 字首是子音字母，但發母音
const AN_NO  = ['uni','use','user','usual','euro','once','one','ukulele','ufo']; // 字首是母音字母，但發 /j/ 或 /w/
function articleFor(word){
  const w = (word||'').toLowerCase().replace(/[^a-z]/g,'');
  if(!w) return '';
  if(ARTICLE === 'and' || ARTICLE === 'the') return ARTICLE;
  if(AN_YES.some(x=>w.startsWith(x))) return 'an';
  if(AN_NO.some(x=>w.startsWith(x)))  return 'a';
  return 'aeiou'.includes(w[0]) ? 'an' : 'a';
}
function withArticle(it){                 // 回傳「加好冠詞」的版本，原本那一筆不動
  if(!ARTICLE) return it;
  const word = it.word || it.syl.join('');
  const art = articleFor(word);
  if(!art) return it;
  // 冠詞不重讀，跟單字一起丟進同一套規則：冠詞變成弱起拍，重音還是落在拍點上
  const st = stressTimed([{ key:art, syl:[art], stress:-1 }, { key: it.key || keyOf(word), syl: it.syl, stress: it.stress }]);
  return Object.assign({}, it, {
    r: st.r, lead: st.leadLen, acc: st.acc,
    stress: it.stress + 1,                // 重音跟著往後移
    syl: [art, ...it.syl],
    artCount: 1,                          // 開頭第幾個音節是冠詞（顯示時用淡色）
    speak: art + ' ' + word               // 念出來的時候是「完整的字」
  });
}

/* ===== 句子 Sentence ========================================================
   用上面同一套「重音計時」規則：實詞的重音音節落在拍點上，
   虛詞（冠詞、代名詞、be 動詞、助動詞、介系詞…）整個字都是輕音，擠進拍子裡。 */
const FUNC = new Set(('a an the and or but so if as of in on at to for with from by '+
  'i you he she it we they me him her us them my your his its our their '+
  'is am are was were be been being do does did done '+
  'will would can could shall should may might must '+
  'this that these those there here not very too some any '+
  'through into onto after before than about around because while until since though although unless').split(' '));
function wordPart(raw){
  const clean = raw.replace(/[^A-Za-z']/g,''), key = clean.toLowerCase().replace(/'/g,'');
  if(!clean) return null;
  if(FUNC.has(key)) return { text:raw, key, syl:syllabify(clean), stress:-1 };          // 虛詞：整個字都輕
  const hit = ITEMS.find(it=>it.key===key);                                            // 實詞：先查字庫
  if(hit) return { text:raw, key, syl:hit.syl, stress:hit.stress };
  const syl = syllabify(clean);                                                        // 再用字典＋規則
  return { text:raw, key, syl, stress:stressOf(clean,syl.length) };
}
function sentenceItem(text){
  const words = text.trim().split(/\s+/).map(wordPart).filter(Boolean);
  if(!words.length) return null;
  const st = stressTimed(words);
  return { words, groups:st.groups, r:st.r, acc:st.acc, text:words.map(w=>w.text).join(' '), sentence:true };
}
/* 長度要在「按下播放的當下」才算，這樣調速度之後不用重打句子也會跟著變 */
function sentenceDur(it){
  const beat = 60/BPM, dur = [];
  it.groups.forEach((g,gi)=>{
    if(gi>0) dur.push(0);
    const arr=[...g.r], total=arr.reduce((a,k)=>a+BEATS[k],0)||1;
    const scale = (ONEBEAT && !g.lead) ? 1/total : 1;   // 每一拍剛好一拍；弱起拍照自己的長度
    arr.forEach(k=>dur.push(BEATS[k]*scale*beat));
  });
  return dur;
}
function sentenceCard(it, idx){
  const blocks = it.groups.map(g=>{
    const t = g.syls.map((s,k)=>{
      const txt = s.str ? `<b>${s.t}</b>` : s.t;
      const cont = s.i < s.w.syl.length-1;                  // 這個字還沒結束，用 - 接到下一個音節
      return txt + (cont ? '-' : (k===g.syls.length-1 ? '' : ' '));
    }).join('');
    return `<div class="sw${g.lead?' fn':''}">${notes(g.r)}<div class="t">${t}</div></div>`;
  }).join('');
  return `<div class="card wide custom" style="background:#eef2ff">
    <div class="sent">${blocks}</div>
    <div class="cap">整句 Sentence　·　一個重音一拍，輕音擠進拍子裡</div>
    <div class="btns"><button class="play" data-i="${idx}" data-a="r">▶ 節奏 Rhythm</button><button class="play" data-i="${idx}" data-a="w">🔊 發音 Say it</button></div>
  </div>`;
}

function cardHtml(raw, custom, idx){
  const it = withArticle(raw);
  const text=it.syl.map((s,i)=> i<(it.artCount||0) ? `<span class="art">${s}</span>`
                               : (i===it.stress?`<b>${s}</b>`:s)).join(' ');
  const pic = it.img ? `<div class="pic"><img src="${it.img}" alt="${raw.syl.join('')}"></div>` : (it.emoji ? `<div class="pic" aria-hidden="true">${it.emoji}</div>` : '');
  return `<div class="card${custom?' custom':''}" style="background:${it.bg}">${pic}${notes(it.r)}<div class="syl">${text}</div>${it.cap?`<div class="cap">${it.cap}</div>`:''}<div class="btns"><button class="play" data-i="${idx}" data-a="r">▶ 節奏 Rhythm</button><button class="play" data-i="${idx}" data-a="w">🔊 發音 Say it</button></div></div>`;
}
let shown=[];
function render(){
  const v=(q ? q.value : '').trim(); shown=[]; let html='';
  const sentEl = document.getElementById('sent');
  const sv = (sentEl ? sentEl.value : '').trim();
  if(!v&&!filterR&&!sv){ res.innerHTML='<p class="empty">打一句英文，就會排出整句的節奏。 Type a sentence to see its rhythm.</p>'; count.textContent=''; return; }
  // ⑤ 自己打的整句，最優先
  if(sv){ const si=sentenceItem(sv); if(si){ shown.push(si); html+=sentenceCard(si,shown.length-1); } }
  let manual=null;
  if(v.includes('-')){ const c=parse(v); if(c.syl.every(Boolean)){ manual=c; shown.push(c); html+=cardHtml(c,true,0); } }   // 使用者自己用 - 分的音節
  const k=v.replace(/[-^]/g,'').toLowerCase().replace(/\s+/g,'');
  // 字庫裡找：完全相同的排最前面，再來是開頭相同，最後才是包含
  const exact=[], starts=[], has=[];
  ITEMS.forEach(it=>{ if(filterR&&it.r!==filterR) return;
    if(manual&&it.key===k) return;                      // 自己分過的字就不再列字庫那一張，避免重複
    if(!k){ has.push(it); } else if(it.key===k){ exact.push(it); } else if(it.key.startsWith(k)){ starts.push(it); }
    else if(k.length>=3&&it.key.includes(k)){ has.push(it); } });
  const list = q ? [...exact,...starts,...has] : [];   // 沒有單字輸入框（造句版）就不列字庫
  // 字庫裡沒有「一模一樣」的字，就自動分析一個（自己用 - 分的也算）
  if(k.length>=2&&!manual&&!exact.length&&/^[a-z' ]+$/.test(v.replace(/[-^]/g,'').toLowerCase())){
    const a=autoItem(v); if(a&&(!filterR||a.r===filterR)){ shown.push(a); html+=cardHtml(a,true,0); } }
  // ④ 主詞 ＋ 動詞 ＋ 冠詞 ＋ 查到的字 → 組成一句
  const head=(manual||exact[0]||starts[0]||has[0]);
  if(!sv && head && (SUBJ || VERB)){
    const noun=head.word||head.syl.join('');
    const art = ARTICLE==='and' ? '' : (ARTICLE ? articleFor(noun) : '');
    const si=sentenceItem([SUBJ, VERB, art, noun].filter(Boolean).join(' '));
    if(si){ shown.push(si); html+=sentenceCard(si,shown.length-1); }
  }
  list.forEach(it=>{ shown.push(it); html+=cardHtml(it,false,shown.length-1); });
  res.innerHTML = html || '<p class="empty">找不到。試試用 - 自己分音節。 No match — try splitting it with “-”.</p>';
  count.textContent = '';
}
/* 主詞、動詞、整句 */
let SUBJ = (()=>{ try{ const v=localStorage.getItem('rs2_subj'); return v===null?'He':v; }catch(e){ return 'He'; } })();
let VERB = (()=>{ try{ const v=localStorage.getItem('rs2_verb'); return v===null?'ate':v; }catch(e){ return 'ate'; } })();
(function(){
  const seg=document.getElementById('subjseg'), vb=document.getElementById('verb'), st=document.getElementById('sent');
  if(st) st.addEventListener('input',render);     // 整句輸入框要先接上，不受下面的主詞／動詞影響
  if(!seg||!vb) return;
  const paint=()=>seg.querySelectorAll('.seg').forEach(b=>b.setAttribute('aria-pressed', b.dataset.s===SUBJ));
  paint(); vb.value=VERB;
  seg.addEventListener('click',e=>{ const b=e.target.closest('.seg'); if(!b) return;
    SUBJ=b.dataset.s; paint(); try{ localStorage.setItem('rs2_subj',SUBJ); }catch(e){} render(); });
  vb.addEventListener('input',()=>{ VERB=vb.value.trim(); try{ localStorage.setItem('rs2_verb',VERB); }catch(e){} render(); });
})();

/* 冠詞控制項 */
(function(){
  const seg=document.getElementById('artseg'); if(!seg) return;
  const paint=()=>seg.querySelectorAll('.seg').forEach(b=>b.setAttribute('aria-pressed', b.dataset.a===ARTICLE));
  paint();
  seg.addEventListener('click',e=>{ const b=e.target.closest('.seg'); if(!b) return;
    ARTICLE=b.dataset.a; paint(); try{ localStorage.setItem('rs2_article',ARTICLE); }catch(e){} render(); });
})();

/* 速度控制項 */
(function(){
  const sl=document.getElementById('bpm'), ov=document.getElementById('bpmv'), ob=document.getElementById('onebeat');
  if(!sl) return;
  const show=()=>{ ov.textContent = BPM + ' BPM'; };
  sl.value=BPM; ob.checked=ONEBEAT; show();
  sl.addEventListener('input',()=>{ BPM=+sl.value; show(); try{ localStorage.setItem('rs_bpm',BPM); }catch(e){} });
  ob.addEventListener('change',()=>{ ONEBEAT=ob.checked; try{ localStorage.setItem('rs_onebeat',ONEBEAT?'1':'0'); }catch(e){} });
})();
res.addEventListener('click',e=>{ const b=e.target.closest('.play'); if(!b) return; const src=shown[+b.dataset.i];
  const it = src.sentence ? src : withArticle(src);
  if(b.dataset.a==='w') say(src.sentence ? src.text : (it.speak || src.word || src.syl.join(''))); else play(it); });
render();
</script>
</body>
