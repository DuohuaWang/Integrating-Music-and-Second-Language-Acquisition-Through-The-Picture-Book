<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A very happy caterpillar | Flash card</title>
<style>
  :root{ color-scheme:light dark; --page:#f3f4f6; --ink:#1f2937; --muted:#4b5563; --panel:#fff; --line:#d1d5db; box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --page:#111418; --ink:#e5e7eb; --muted:#9ca3af; --panel:#1b2027; --line:#374151; } }
  :root[data-theme="dark"]{ --page:#111418; --ink:#e5e7eb; --muted:#9ca3af; --panel:#1b2027; --line:#374151; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--page); color:var(--ink); font-family:"Noto Sans TC","PingFang TC",system-ui,sans-serif; }
  .hero{ background:linear-gradient(135deg,#5b21b6 0%,#0e7490 65%,#15803d 100%); color:#fff; text-align:center; padding:2.2rem 1.25rem; position:relative; overflow:hidden; }
  .hero h1{ margin:0; font-size:clamp(1.5rem,6vw,2.3rem); }
  .hero p{ margin:.4rem 0 0; color:#fde68a; }
  .fl{ position:absolute; animation:bob 5s ease-in-out infinite; font-size:2rem; pointer-events:none; }
  @keyframes bob{ 50%{ transform:translateY(-10px) rotate(6deg); } }
  main{ max-width:30rem; margin:0 auto; padding:1.2rem 1rem 3rem; }
  .bar{ display:flex; flex-wrap:wrap; gap:.5rem; justify-content:center; margin-bottom:.8rem; }
  .btn{ background:#e5e7eb; color:#374151; border:0; border-radius:.5rem; padding:.45rem .9rem; font:inherit; font-size:.9rem; font-weight:500; cursor:pointer; }
  .btn:hover{ background:#d1d5db; }
  .btn[aria-pressed="true"]{ background:#5b21b6; color:#fff; }
  .btn:focus-visible,.flip:focus-visible{ outline:3px solid #6aa84f; outline-offset:2px; }
  .tempo{ display:flex; align-items:center; gap:.6rem; flex-wrap:wrap; justify-content:center; margin:.2rem 0 .8rem; }
  .tempo input[type=range]{ flex:1; min-width:8rem; max-width:16rem; accent-color:#5b21b6; height:2rem; }
  .tempo output{ font-weight:600; min-width:5.5rem; }
  .tempo label{ display:flex; align-items:center; gap:.4rem; font-size:.9rem; }
  .tempo input[type=checkbox]{ width:1.15rem; height:1.15rem; accent-color:#5b21b6; }
  .stat{ text-align:center; color:var(--muted); font-size:.9rem; margin:.2rem 0 .8rem; }
  .flip{ perspective:1000px; width:100%; height:27rem; cursor:pointer; border-radius:1.25rem; }
  .inner{ position:relative; width:100%; height:100%; transition:transform .5s; transform-style:preserve-3d; }
  .flip.on .inner{ transform:rotateY(180deg); }
  @media (prefers-reduced-motion:reduce){ .inner{ transition:none; } .fl{ animation:none; } }
  .face{ position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; border-radius:1.25rem; box-shadow:0 2px 12px rgba(0,0,0,.12);
    color:#000; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.5rem; padding:1rem; }
  .back{ transform:rotateY(180deg); }
  .face img{ width:100%; height:15rem; object-fit:contain; }
  .big{ font-size:7rem; line-height:1; }
  .tip{ font-size:.85rem; opacity:.7; }
  .back .btn{ font-size:1.15rem; padding:.7rem 1.3rem; }
  .syl{ font-family:"Times New Roman",Times,serif; font-size:clamp(2.4rem,11vw,3.8rem); line-height:1.1; text-align:center; }
  .syl b{ font-weight:700; }
  .face svg{ height:160px; width:auto; max-width:92%; }
  .star{ position:absolute; top:.6rem; right:.7rem; background:rgba(255,255,255,.6); border:0; border-radius:50%; width:2.4rem; height:2.4rem; font-size:1.3rem; cursor:pointer; }
  .nav{ display:flex; gap:.6rem; justify-content:center; margin-top:1rem; }
  .nav .btn{ flex:1; max-width:9rem; }
  .ok{ background:#15803d; color:#fff; }
  .ok:hover{ background:#166534; }
  .empty{ text-align:center; color:var(--muted); padding:3rem 0; }
</style>
</head>
<body>
<header class="hero">
  <span class="fl" style="left:6%;top:18%" aria-hidden="true">🍎</span><span class="fl" style="left:26%;top:62%;animation-delay:.8s" aria-hidden="true">♪</span>
  <span class="fl" style="left:72%;top:14%;animation-delay:1.4s" aria-hidden="true">♫</span><span class="fl" style="left:88%;top:58%;animation-delay:.4s" aria-hidden="true">🍓</span>
  <h1>A very happy caterpillar</h1><p>Flash card</p>
</header>
<main>
  <div class="bar" id="modes">
    <button class="btn" data-m="all" aria-pressed="true">全部 All</button>
    <button class="btn" data-m="star" aria-pressed="false">★ 標記</button>
    <button class="btn" data-m="todo" aria-pressed="false">未學會</button>
    <button class="btn" id="shuffle">🔀 洗牌</button>
    <button class="btn" id="auto" aria-pressed="true">🔊 自動發音</button>
  </div>
  <div class="tempo">
    <span aria-hidden="true">🐢</span>
    <input id="bpm" type="range" min="40" max="160" step="2" aria-label="速度 Tempo (BPM)">
    <span aria-hidden="true">🐇</span>
    <output id="bpmv" for="bpm"></output>
    <label><input id="onebeat" type="checkbox"> 一個單字一拍</label>
  </div>
  <div class="stat" id="stat"></div>
  <div id="stage"></div>
  <div class="nav" id="nav">
    <button class="btn" id="prev">← 上一張</button>
    <button class="btn ok" id="got">已學會 ✓</button>
    <button class="btn" id="next">下一張 →</button>
  </div>
</main>

const META = { cake:'q', plum:'er', pear:'er', apple:'ee', orange:'ds', chocolate:'ess', strawberry:'ess' };
const RAW = `Apple|蘋果|^A-pple|🍎 Pear|梨子|^Pear|🍐 Plum|李子|^Plum|🍑 Strawberry|草莓|^Straw-ber-ry|🍓 Orange|柳橙|^or-ange|🍊 Cake|蛋糕|^Cake|🍰 Chocolate|巧克力|^Ch-oco-late|🍫
Egg|蛋|^Egg|🥚 Leaf|葉子|^Leaf|🍃 Caterpillar|毛毛蟲|^Cat-er-pil-lar|🐛 Cocoon|繭|co-^coon|🐚 Butterfly|蝴蝶|^But-ter-fly|🦋 Moon|月亮|^Moon|🌙 Sun|太陽|^Sun|☀️ Watermelon|西瓜|^Wa-ter-mel-on|🍉 Cheese|起司|^Cheese|🧀 Pie|派|^Pie|🥧`.split(/\s(?=[A-Z][a-z]+\|)/);
const PAL=['#f6d092','#a0c4c3','#e2a9f1','#f8a680','#d7bfb6','#ffcf87'];
const CARDS = RAW.filter(l=>/^(Apple|Pear|Plum|Strawberry|Orange|Cake|Chocolate)\|/.test(l.trim())).map((l,i)=>{ const [w,cn,sy,em]=l.trim().split('|'); let stress=0;
  const syl=sy.split('-').map((p,k)=>{ if(p.startsWith('^')){stress=k;p=p.slice(1);} return p; });
  const key=w.toLowerCase(), n=syl.length;
  return { key, w, cn, syl, stress, em, r: META[key]|| (n===1?'q':'e'.repeat(n)), bg: PICS[key]?PICS[key].bg:PAL[i%PAL.length], img: PICS[key]?PICS[key].src:'' }; });
function notes(r){
  const T=[...r]; let x=24; const pos=T.map(t=>{ const p=x; x+= t==='r'?34:(t==='d'?54:44); return p; });
  let s=`<svg viewBox="0 0 ${x+6} 96" aria-hidden="true">`;
  T.forEach((t,i)=>{ const cx=pos[i];
    if(t==='r'){ s+=`<circle cx="${cx+3}" cy="42" r="6.5" fill="#000"/><path d="M${cx+3} 40 Q${cx+16} 40 ${cx+16} 30 M${cx+16} 30 L${cx+2} 72" stroke="#000" stroke-width="4" fill="none" stroke-linecap="round"/>`; }
    else { s+=`<ellipse cx="${cx}" cy="76" rx="15" ry="10.5" transform="rotate(-22 ${cx} 76)" fill="#000"/><rect x="${cx+12}" y="14" width="3.5" height="62" fill="#000"/>`;
      if(t==='d') s+=`<circle cx="${cx+25}" cy="76" r="4.5" fill="#000"/>`;   // 附點：音符右邊的小圓點
    }
  });
  const isN=t=>t==='e'||t==='s'||t==='d';   // 可以連成一束（有符桿、有符尾）的音符
  for(let i=0;i<T.length;){
    if(!isN(T[i])){ i++; continue; }
    let j=i; while(j+1<T.length&&isN(T[j+1])) j++;
    if(j>i){
      s+=`<rect x="${pos[i]+12}" y="14" width="${pos[j]-pos[i]+3.5}" height="9" fill="#000"/>`;
      for(let k=i;k<=j;k++){ if(T[k]!=='s') continue;
        if(k<j&&T[k+1]==='s') s+=`<rect x="${pos[k]+12}" y="28" width="${pos[k+1]-pos[k]+3.5}" height="6" fill="#000"/>`;
        else if(!(k>i&&T[k-1]==='s')) s+= k>i ? `<rect x="${pos[k]-2}" y="28" width="14.5" height="6" fill="#000"/>` : `<rect x="${pos[k]+12}" y="28" width="14" height="6" fill="#000"/>`; }
    } else if(T[i]==='e'||T[i]==='d'){ const x0=pos[i]+12; s+=`<path d="M${x0} 14 C${x0+4} 24 ${x0+22} 30 ${x0+16} 52 C${x0+16} 40 ${x0+6} 36 ${x0} 34 Z" fill="#000"/>`; }
    i=j+1;
  }
  return s+'</svg>';
}

let ctx;

/* ===== 速度設定 Tempo =========================================================
   BEATS：每個音符佔幾拍（q=1拍、d=附點八分=3/4拍、e=半拍、s=1/4拍、r=半拍休止）
   ONEBEAT = true 時「一個單字＝一拍」：整個字會被壓縮成剛好一拍，
             所以三音節的字會變成一拍三連音，四音節變成一拍四個音。
   ONEBEAT = false 時就照音符本身的長度走。
   BPM：每分鐘幾拍，使用者可以自己拉。 */
const BEATS = {q:1, d:.75, e:.5, s:.25, r:.5};
let BPM = (()=>{ try{ return +localStorage.getItem('rs_bpm') || 90; }catch(e){ return 90; } })();
let ONEBEAT = (()=>{ try{ return localStorage.getItem('rs_onebeat') !== '0'; }catch(e){ return true; } })();
function timing(r){                       // 算出這個節奏每個音符要響多久（秒）
  const arr = [...r], total = arr.reduce((a,k)=>a+BEATS[k], 0) || 1;
  const beat = 60/BPM, scale = ONEBEAT ? 1/total : 1;
  return arr.map(k => BEATS[k]*scale*beat);
}
function play(it){
  ctx = ctx || new (window.AudioContext||window.webkitAudioContext)();
  if(ctx.state==='suspended') ctx.resume();
  const arr=[...it.r], dur=timing(it.r);
  let t=ctx.currentTime+.05, n=0;
  arr.forEach((k,i)=>{ const d=dur[i];
    if(k!=='r'){
      const o=ctx.createOscillator(), g=ctx.createGain(), st=n===it.stress; n++;
      o.type='triangle'; o.frequency.value= st?660:440;
      const len=Math.max(.08,Math.min(d*.9,.5));
      g.gain.setValueAtTime(st?.5:.3,t); g.gain.exponentialRampToValueAtTime(.001,t+len);
      o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t+len+.02); }
    t+=d; });
}

const FEM=['samantha','ava','allison','susan','victoria','karen','moira','tessa','fiona','serena','zira','jenny','aria','google us english','female'];
function pickVoice(){
  const v=(window.speechSynthesis?speechSynthesis.getVoices():[]).filter(x=>/^en/i.test(x.lang));
  for(const n of FEM){ const f=v.find(x=>x.name.toLowerCase().includes(n)&&/^en[-_]US/i.test(x.lang))||v.find(x=>x.name.toLowerCase().includes(n)); if(f) return f; }
  return v.find(x=>/^en[-_]US/i.test(x.lang))||v[0]||null;
}
function say(t){ try{ const u=new SpeechSynthesisUtterance(t); u.lang='en-US'; const v=pickVoice(); if(v){ u.voice=v; u.lang=v.lang; } u.rate=.85; u.pitch=1.15; speechSynthesis.cancel(); speechSynthesis.speak(u); }catch(e){} }
try{ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices(); }catch(e){}
/* 速度控制項 */
(function(){
  const sl=document.getElementById('bpm'), ov=document.getElementById('bpmv'), ob=document.getElementById('onebeat');
  if(!sl) return;
  const show=()=>{ ov.textContent = BPM + ' BPM'; };
  sl.value=BPM; ob.checked=ONEBEAT; show();
  sl.addEventListener('input',()=>{ BPM=+sl.value; show(); try{ localStorage.setItem('rs_bpm',BPM); }catch(e){} });
  ob.addEventListener('change',()=>{ ONEBEAT=ob.checked; try{ localStorage.setItem('rs_onebeat',ONEBEAT?'1':'0'); }catch(e){} });
})();
const load=k=>{ try{ return new Set(JSON.parse(localStorage.getItem(k)||'[]')); }catch(e){ return new Set(); } };
const save=(k,s)=>{ try{ localStorage.setItem(k,JSON.stringify([...s])); }catch(e){} };
let known=load('vhc_known'), stars=load('vhc_star'), mode='all', order=[], pos=0, flipped=false;
const stage=document.getElementById('stage'), stat=document.getElementById('stat'), nav=document.getElementById('nav');
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function build(keepFirst){
  order=shuffle(CARDS.map((_,i)=>i)).filter(i=> mode==='all' || (mode==='star'&&stars.has(CARDS[i].key)) || (mode==='todo'&&!known.has(CARDS[i].key)));
  pos=0; flipped=false; draw(); }
function draw(){
  stat.textContent=`已學會 Known ${known.size} / ${CARDS.length}`+(order.length?`　｜　${pos+1} / ${order.length}`:'');
  if(!order.length){ stage.innerHTML='<p class="empty">這裡沒有卡片。 No cards here.</p>'; nav.hidden=true; return; }
  nav.hidden=false; const c=CARDS[order[pos]];
  const text=c.syl.map((s,i)=>i===c.stress?`<b>${s}</b>`:s).join(' ');
  const front=c.img?`<img src="${c.img}" alt="">`:`<div class="big" aria-hidden="true">${c.em}</div>`;
  stage.innerHTML=`<div class="flip${flipped?' on':''}" id="flip" role="button" tabindex="0" aria-label="${c.w}, tap to flip">
    <div class="inner">
      <div class="face" style="background:${c.bg}">${front}<div class="tip">點一下翻面 Tap to flip</div>
        <button class="star" id="star" aria-label="star" aria-pressed="${stars.has(c.key)}">${stars.has(c.key)?'★':'☆'}</button></div>
      <div class="face back" style="background:${c.bg}">${notes(c.r)}<div class="syl">${text}</div>
        <div class="bar" style="margin:.4rem 0 0"><button class="btn" id="play">▶ 節奏 Rhythm</button><button class="btn" id="say">🔊 發音 Say it</button></div></div>
    </div></div>`;
  const f=document.getElementById('flip');
  const toggle=()=>{ flipped=!flipped; f.classList.toggle('on',flipped); if(flipped) autoSay(); };
  f.addEventListener('click',toggle);
  f.addEventListener('keydown',e=>{ if((e.key==='Enter'||e.key===' ')&&e.target===f){ e.preventDefault(); toggle(); } });
  document.getElementById('star').addEventListener('click',e=>{ e.stopPropagation(); stars.has(c.key)?stars.delete(c.key):stars.add(c.key); save('vhc_star',stars); e.target.textContent=stars.has(c.key)?'★':'☆'; });
  document.getElementById('play').addEventListener('click',e=>{ e.stopPropagation(); play(c); });
  document.getElementById('say').addEventListener('click',e=>{ e.stopPropagation(); say(c.w); });
}
let auto=(()=>{ try{ return localStorage.getItem('vhc_auto')!=='0'; }catch(e){ return true; } })();
const autoBtn=document.getElementById('auto'); autoBtn.setAttribute('aria-pressed',auto);
autoBtn.onclick=()=>{ auto=!auto; autoBtn.setAttribute('aria-pressed',auto); try{ localStorage.setItem('vhc_auto',auto?'1':'0'); }catch(e){} if(auto) autoSay(); else try{ speechSynthesis.cancel(); }catch(e){} };
function autoSay(){ if(auto&&order.length) say(CARDS[order[pos]].w); }
const go=d=>{ if(!order.length) return; pos=(pos+d+order.length)%order.length; flipped=false; draw(); autoSay(); };
document.getElementById('next').onclick=()=>go(1);
document.getElementById('prev').onclick=()=>go(-1);
document.getElementById('got').onclick=()=>{ if(!order.length) return; known.add(CARDS[order[pos]].key); save('vhc_known',known);
  if(mode==='todo'){ order.splice(pos,1); if(pos>=order.length) pos=0; flipped=false; draw(); autoSay(); } else go(1); };
document.getElementById('shuffle').onclick=()=>build();
document.getElementById('modes').addEventListener('click',e=>{ const b=e.target.closest('[data-m]'); if(!b) return; mode=b.dataset.m;
  document.querySelectorAll('[data-m]').forEach(x=>x.setAttribute('aria-pressed',x===b)); build(); });
build();
</script>
</body>
